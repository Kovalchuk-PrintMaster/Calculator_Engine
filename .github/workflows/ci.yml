name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/admin.txt -r requirements/app.txt -r requirements/dev.txt
          pip install -e .

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (black)
        run: python -m black --check .

      - name: Type check (mypy)
        env:
          PYTHONPATH: apps/api/backend:.
        run: python -m mypy

      - name: Django check
        run: python apps/admin/manage.py check

      - name: Run tests (pytest)
        env:
          PYTHONPATH: apps/api/backend:.
        run: python -m pytest support/tests -q
