[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-engine"
version = "0.0.1"
description = "Pricing calculator engine for print shop"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "apps/api/backend"}

[tool.setuptools.packages.find]
where = ["apps/api/backend"]
include = ["calculator_engine*"]

[tool.pytest.ini_options]
testpaths = ["support/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["calculator_engine"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"infra/db/alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
no_implicit_optional = true
show_error_codes = true
pretty = true
files = [
    "apps/api/backend/calculator_engine",
    "apps/admin",
    "settings",
    "support",
]