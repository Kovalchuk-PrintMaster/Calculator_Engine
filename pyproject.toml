[project]
name = "calculator-engine"
version = "0.0.1"
description = "Pricing calculator engine for print shop"
readme = "README.md"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E,F — pycodestyle/pyflakes; I — isort; B — flake8-bugbear; UP — pyupgrade
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["calculator_engine"]
combine-as-imports = true

# ---------------------- Mypy (static typing) ----------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

# Core strictness for production code under src/
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
check_untyped_defs = true
pretty = true
show_error_codes = true

# What to analyze by default
files = ["src"]

# Soften rules for tests (faster test writing)
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false
check_untyped_defs = false
