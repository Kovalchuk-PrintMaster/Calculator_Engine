services:
  postgres:
    image: postgres:16-alpine
    container_name: calc_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calculator}
      POSTGRES_USER: ${POSTGRES_USER:-calc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calc_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - "${CALC_STATE_DIR}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: calc_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "${CALC_STATE_DIR}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10